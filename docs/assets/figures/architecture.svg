<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Reconis 系统架构</title>
  <desc id="desc">Vue单页工作台通过同源接口访问Spring Boot业务模块，MyBatis连接SQL Server；服务连接文件存储和DEMO、支付宝沙箱渠道。SQL Server承载15张表、5个过程、2个函数、9个触发器和中文全文索引。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1280" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#203a59"/><stop offset="1" stop-color="#101c2e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 5 4-5 4" stroke="#8299b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}.heading{font-size:23px;font-weight:700;fill:#19314f}.label{font-size:17px;fill:#3f5775}.muted{font-size:15px;fill:#6a7e97}.tag{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#6c86a7}.icon{stroke:#6886ab;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.big{font-size:34px;font-weight:700;fill:#294c77}</style>
  </defs>
  <rect x="1" y="1" width="1278" height="758" rx="24" fill="#f5f8fc" stroke="#dce5ef"/>
  <path d="M25 1h1230a24 24 0 0 1 24 24v109H1V25A24 24 0 0 1 25 1Z" fill="url(#header)"/>
  <text x="44" y="55" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="white">一套工作台，一条可追溯的数据链</text>
  <text x="44" y="91" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#b6c9e0">Vue 3 + Spring Boot + MyBatis + SQL Server 2022</text>
  <rect x="1050" y="46" width="186" height="38" rx="19" fill="#304661" stroke="#49617e"/>
  <text x="1143" y="71" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" fill="#d5e4f6">同源部署 · 单个 JAR</text>
  <rect x="44" y="174" width="286" height="256" rx="18" fill="white" stroke="#d8e3ef"/>
  <g class="icon"><rect x="68" y="199" width="34" height="25" rx="4"/><path d="M78 232h14m-7-8v8"/></g>
  <text x="120" y="221" class="heading">角色工作台</text>
  <text x="68" y="262" class="tag">VUE 3 · TYPESCRIPT</text>
  <text x="68" y="298" class="label">页面与公共组件</text>
  <text x="68" y="330" class="label">路由 · 会话状态 · 数据图表</text>
  <path d="M68 353h238" stroke="#e7edf5"/>
  <text x="68" y="385" class="muted">消费者 / 商户 / 财务 / 审计</text>
  <rect x="410" y="174" width="430" height="256" rx="18" fill="white" stroke="#b9cce2"/>
  <g class="icon"><rect x="434" y="200" width="33" height="30" rx="5"/><path d="M434 210h33m-25-5h2m5 0h2m-9 12h16m-16 6h10"/></g>
  <text x="485" y="222" class="heading">业务服务</text>
  <text x="434" y="262" class="tag">SPRING BOOT · MYBATIS</text>
  <rect x="434" y="281" width="178" height="43" rx="9" fill="#eff4fb"/>
  <rect x="630" y="281" width="186" height="43" rx="9" fill="#eff4fb"/>
  <rect x="434" y="337" width="178" height="43" rx="9" fill="#eff4fb"/>
  <rect x="630" y="337" width="186" height="43" rx="9" fill="#eff4fb"/>
  <text x="523" y="308" text-anchor="middle" class="label">身份 · 商户 · 订单</text>
  <text x="723" y="308" text-anchor="middle" class="label">支付 · 退款 · 对账</text>
  <text x="523" y="364" text-anchor="middle" class="label">工单 · 证据 · 复核</text>
  <text x="723" y="364" text-anchor="middle" class="label">统计 · 导出 · 审计</text>
  <rect x="920" y="174" width="316" height="120" rx="18" fill="white" stroke="#d8e3ef"/>
  <g class="icon"><path d="M944 202h13l6 7h20v27h-39z"/></g>
  <text x="999" y="221" class="heading">文件存储</text>
  <text x="944" y="263" class="muted">账单原件 · 工单证据 · 导出文件</text>
  <rect x="920" y="310" width="316" height="120" rx="18" fill="white" stroke="#d8e3ef"/>
  <g class="icon"><path d="M947 341h29v25h-29zm0 8h29m-21 9h7m13-24 8 8-8 8"/></g>
  <text x="999" y="357" class="heading">支付渠道</text>
  <text x="944" y="398" class="muted">DEMO / 支付宝沙箱 · 查询与通知</text>
  <path d="M331 302h67" stroke="#8299b6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="279" text-anchor="middle" class="muted">HTTP</text>
  <g stroke="#8299b6" stroke-width="2" marker-end="url(#arrow)"><path d="M841 234h67"/><path d="M841 370h67"/></g>
  <path d="M625 431v61" stroke="#8299b6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="647" y="468" class="muted">SQL · 短事务 · 会话上下文</text>
  <rect x="44" y="504" width="1192" height="212" rx="18" fill="white" stroke="#b9cce2"/>
  <g class="icon"><ellipse cx="88" cy="543" rx="21" ry="8"/><path d="M67 543v28c0 5 9 8 21 8s21-3 21-8v-28m-42 14c0 5 9 8 21 8s21-3 21-8"/></g>
  <text x="128" y="551" class="heading">SQL Server 2022</text>
  <text x="1196" y="550" text-anchor="end" class="muted">身份商户 → 订单资金 → 对账工单 → 审计</text>
  <path d="M68 594h1144" stroke="#e1e9f3"/>
  <text x="80" y="641" class="big">15</text><text x="134" y="638" class="label">张关系表</text><text x="80" y="676" class="muted">3NF · 主外键与约束</text>
  <path d="M324 615v65M564 615v65M804 615v65" stroke="#e1e9f3"/>
  <text x="354" y="641" class="big">5</text><text x="390" y="638" class="label">个存储过程</text><text x="354" y="676" class="muted">确认 · 审批 · 对账 · 复核</text>
  <text x="594" y="641" class="big">2</text><text x="630" y="638" class="label">个标量函数</text><text x="594" y="676" class="muted">退款额度 · 工单逾期</text>
  <text x="834" y="641" class="big">9</text><text x="870" y="638" class="label">个触发器</text><text x="834" y="676" class="muted">事实保护 · 审核留痕</text>
  <text x="1128" y="637" text-anchor="middle" class="label">中文全文</text><text x="1128" y="672" text-anchor="middle" class="muted">检索与推荐</text>
</svg>
