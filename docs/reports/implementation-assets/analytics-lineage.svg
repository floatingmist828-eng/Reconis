<svg xmlns="http://www.w3.org/2000/svg" width="6.3in" height="6.55556in" viewBox="0 0 453.6 472">
<rect width="453.6" height="472" fill="white"/>
<rect x="10" y="10" width="433" height="61" rx="3" fill="#f2f5f8" stroke="#1d4876" stroke-width="0.8"/>
<text x="20" y="26" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#1d4876">共同口径：权限范围 + 业务期间 + 金额范围 + asOf</text>
<text x="20" y="45" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9.1" font-weight="400" fill="#526174">发生日：channel_occurred_at；该时点已知事实：recorded_at ≤ asOf</text>
<rect x="10" y="104" width="204" height="61" rx="3" fill="#ffffff" stroke="#aebbc9" stroke-width="0.8"/>
<text x="20" y="120" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#202b38">组织层级钻取</text>
<text x="20" y="139" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9.4" font-weight="400" fill="#526174">商户 → 门店 → 资金流水</text>
<rect x="239" y="104" width="204" height="61" rx="3" fill="#ffffff" stroke="#aebbc9" stroke-width="0.8"/>
<text x="249" y="120" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#202b38">时间层级钻取</text>
<text x="249" y="139" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9.4" font-weight="400" fill="#526174">年 → 月 → 日 → 资金流水</text>
<polyline points="112,71 112,104" fill="none" stroke="#1d4876" stroke-width="0.9"/>
<polygon points="112,104 109.7802594651724,99.51973751237237 114.2197405348276,99.51973751237237" fill="#1d4876"/>
<polyline points="341,71 341,104" fill="none" stroke="#1d4876" stroke-width="0.9"/>
<polygon points="341,104 338.7802594651724,99.51973751237237 343.2197405348276,99.51973751237237" fill="#1d4876"/>
<polyline points="112,165 112,195 226,195 226,221" fill="none" stroke="#1d4876" stroke-width="0.9"/>
<polygon points="226,221 223.7802594651724,216.5197375123724 228.2197405348276,216.5197375123724" fill="#1d4876"/>
<polyline points="341,165 341,195 226,195" fill="none" stroke="#1d4876" stroke-width="0.9"/>
<polygon points="226,195 230.4802624876276,192.7802594651724 230.4802624876276,197.2197405348276" fill="#1d4876"/>
<rect x="10" y="222" width="433" height="62" rx="3" fill="#f2f5f8" stroke="#1d4876" stroke-width="0.8"/>
<text x="20" y="238" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#1d4876">同一组已确认资金事实</text>
<text x="20" y="257" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9.4" font-weight="400" fill="#526174">收款与退款分别求和；净收款 = 收款 − 退款</text>
<rect x="10" y="320" width="433" height="62" rx="3" fill="#ffffff" stroke="#aebbc9" stroke-width="0.8"/>
<text x="20" y="336" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#202b38">关联追溯</text>
<text x="20" y="355" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9.4" font-weight="400" fill="#526174">工单 → 对账结果 → 账单行 / 流水 → 支付退款 → 订单 → 门店 / 商户</text>
<polyline points="226,284 226,320" fill="none" stroke="#1d4876" stroke-width="0.9"/>
<polygon points="226,320 223.7802594651724,315.5197375123724 228.2197405348276,315.5197375123724" fill="#1d4876"/>
<text x="10" y="412" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">下钻继承全部筛选；时间子范围与父范围求交，不能放大查询范围。</text>
<text x="10" y="426" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">汇总、图表、明细与导出沿用同一口径；重跑结果先去重再聚合。</text>
<text x="10" y="440" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">经营聚合、工单状态与风险统计分别取数，避免一对多联接重复计数。</text>
</svg>