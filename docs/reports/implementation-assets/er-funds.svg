<text x="10" y="538" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">资金事实仅有一个非空来源：RECEIPT → payment_id，REFUND → refund_id。</text>
<text x="10" y="552" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">筛选唯一索引保证一笔支付或退款最多对应一条资金事实。</text>
<text x="10" y="566" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">订单 store_id → store；consumer_id / created_by → app_user。</text>
<text x="10" y="580" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">退款 applicant_id / reviewed_by → app_user；? 表示该外键可空。</text>
<text x="10" y="594" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#526174">所有连线均为实际外键；每订单最多一个 is_primary=1 的支付。</text>
